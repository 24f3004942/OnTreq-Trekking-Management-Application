<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTreq | Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-body">

    <div id="reports-app" v-cloak>
        
        <nav class="sidebar d-flex flex-column p-4">
            <h2 class="fw-bolder mb-5 text-white">On<span style="color: var(--ontreq-accent);">Treq</span></h2>
            <div class="flex-grow-1">
                <p class="text-secondary small fw-bold mb-2 px-2">MAIN MENU</p>
                <a href="admin_dashboard.html" class="nav-link-custom"><i class="bi bi-grid-1x2"></i> Command Center</a>
                <a href="manage_treks.html" class="nav-link-custom"><i class="bi bi-map"></i> Manage Treks</a>
                <a href="manage_staff.html" class="nav-link-custom"><i class="bi bi-person-badge"></i> Trek Staff</a>
                <a href="manage_users.html" class="nav-link-custom"><i class="bi bi-people"></i> Trekkers</a>
                <a href="admin_bookings.html" class="nav-link-custom"><i class="bi bi-journal-check"></i> Bookings</a>
                
                <p class="text-secondary small fw-bold mb-2 mt-4 px-2">SYSTEM</p>
                <a href="admin_reports.html" class="nav-link-custom active"><i class="bi bi-bar-chart-line"></i> Reports & Analytics</a>
                <a href="settings.html" class="nav-link-custom"><i class="bi bi-gear"></i> Settings</a>
            </div>
            <button @click="logout" class="btn btn-outline-danger w-100 mt-auto">
                <i class="bi bi-box-arrow-left"></i> Secure Logout
            </button>
        </nav>

        <main class="main-content">
            <header class="mb-5">
                <h3 class="fw-bold m-0">System Analytics</h3>
                <p class="text-secondary m-0">Real-time platform performance and tracking.</p>
            </header>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="glass-card p-4 h-100">
                        <h5 class="fw-bold mb-4 text-center">Trek Portfolio by Difficulty</h5>
                        <canvas id="difficultyChart"></canvas>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="glass-card p-4 h-100">
                        <h5 class="fw-bold mb-4 text-center">Global Booking Statuses</h5>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin_reports.js"></script>
</body>
</html>
