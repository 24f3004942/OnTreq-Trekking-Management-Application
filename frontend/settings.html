<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnTreq | Settings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body class="dashboard-body">

    <div id="settings-app" v-cloak>
        <nav class="sidebar d-flex flex-column p-4">
            <h2 class="fw-bolder mb-5 text-white">On<span style="color: var(--ontreq-accent);">Treq</span></h2>

            <div class="flex-grow-1">
                <p class="text-secondary small fw-bold mb-2 px-2">NAVIGATION</p>
                <a :href="dashboardLink" class="nav-link-custom"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
                <a href="settings.html" class="nav-link-custom active"><i class="bi bi-gear"></i> Settings</a>
            </div>

            <button @click="logout" class="btn btn-outline-danger w-100 mt-auto">
                <i class="bi bi-box-arrow-left"></i> Secure Logout
            </button>
        </nav>

        <main class="main-content">
            <header class="mb-5">
                <h3 class="fw-bold m-0">Account Settings</h3>
                <p class="text-secondary m-0">Manage your Admin login credentials and account details.</p>
            </header>

            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div v-if="message" class="alert" :class="isError ? 'alert-danger' : 'alert-success'">
                        {{ message }}
                    </div>

                    <div class="glass-card p-4 p-md-5">
                        <h5 class="fw-bold mb-4"><i class="bi bi-person-circle me-2"></i>Profile</h5>
                        <form @submit.prevent="updateSettings">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label text-secondary small">First Name</label>
                                    <input type="text" class="form-control bg-dark border-secondary text-white" v-model="form.first_name">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-secondary small">Last Name</label>
                                    <input type="text" class="form-control bg-dark border-secondary text-white" v-model="form.last_name">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Email Address</label>
                                <input type="email" class="form-control bg-dark border-secondary text-white" v-model="form.email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Contact Phone</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white" v-model="form.phone">
                            </div>

                            <hr class="border-secondary my-4">

                            <h6 class="fw-bold mb-3 text-secondary"><i class="bi bi-shield-lock me-2"></i>Change Password</h6>
                            <div class="mb-4">
                                <label class="form-label text-secondary small">New Password</label>
                                <input type="password" class="form-control bg-dark border-secondary text-white"
                                       v-model="form.password" placeholder="Leave blank to keep your current password">
                            </div>

                            <button type="submit" class="btn w-100 py-2" style="background-color: var(--ontreq-accent); color: #111;" :disabled="isLoading">
                                <span v-if="isLoading" class="spinner-border spinner-border-sm me-2"></span>
                                Save Changes
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="settings.js"></script>
</body>
</html>
